services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook
      POSTGRES_DB: slotbook
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://slotbook:slotbook@db:5432/slotbook
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-change-me}
    depends_on:
      db: { condition: service_healthy }
  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook
      POSTGRES_DB: slotbook_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      target: build
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgres://slotbook:slotbook@test-db:5432/slotbook_test
    command: npm test
    depends_on:
      test-db: { condition: service_healthy }
volumes:
  postgres-data:
